<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Product list with cart</title>
  </head>
  <body>
    <header>
      <div class="app">
        <h1>Desserts</h1>
      </div>
    </header>

    <main class="app">
      <section id="products" aria-label="Dessert products">
        <ul class="products-grid"></ul>
      </section>

      <section id="cart" aria-label="Shopping cart">
        <h2>Your Cart (<span id="cartCount">0</span>)</h2>

        <div class="cart_empty" aria-live="polite">
          <img src="images/illustration-empty-cart.svg" alt="empty cart" />
          <p>Your added items will appear here</p>
        </div>

        <ul class="cart_items hidden" aria-label="Cart items list"></ul>

        <div class="cart_summary hidden">
          <div class="cart_total-row">
            <p class="cart_total-label">Order Total</p>
            <p class="cart_total-value">$<span id="totalAmount">0.00</span></p>
          </div>
          <div class="carbon-neutral">
            <img src="images/icon-carbon-neutral.svg" alt="" srcset="" />
            <p>This is a <strong>carbon-neutral</strong> delivery</p>
          </div>
          <button type="button" id="confirmOrderBtn" class="cart_confirm-btn">
            Confirm Order
          </button>
        </div>
      </section>
    </main>

    <div class="modal-overlay hidden" id="orderModal">
      <div
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <div class="success-icon">✓</div>
        <h2 id="modalTitle">Order Confirmed</h2>
        <p class="modal-subtitle">We hope you enjoy your food!</p>

        <div class="modal_summary" aria-label="Order summary"></div>

        <div class="modal-total">
          <span class="modal-total-label">Order Total</span>
          <span class="modal-total-value"
            >$<span id="modalTotalAmount">0.00</span></span
          >
        </div>

        <button type="button" id="newOrderBtn">Start New Order</button>
      </div>
    </div>
    <footer class="footer">
      Coded by
      <a href="https://github.com/lindamaduka" target="_blank" rel="noreferrer"
        >Linda Maduka</a
      >
    </footer>
    <script src="script.js"></script>
  </body>
</html>
